<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O Meu Site</title>
  <meta name="description" content="Uma breve descrição do meu site.">
  <style>
    * { box-sizing: border-box; }
    html { font-size: clamp(16px, 1.2vw + 12px, 22px); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(1rem, 5vw, 4rem);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #fff;
      background: #003893;
      text-align: center;
    }
    main { flex: 1; }
    header, footer { padding: 1.5rem 0; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1rem; }
    nav a { color: #fff; }
    footer { border-top: 1px solid rgba(255, 255, 255, 0.4); font-size: 0.9rem; }
    #game {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: 0 auto;
      background: #002a70;
      border-radius: 8px;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jump!</h1>
    <nav>
    </nav>
  </header>

  <main>
    <h2>Jogo de saltos</h2>
    <p>Chegue à bandeira em cada um dos 20 níveis. Mova-se com as setas ou com A/D, salte com Cima, W ou Espaço e prima R para reiniciar o nível.</p>
    <p id="status" aria-live="polite"></p>
    <canvas id="game" width="640" height="360" aria-label="Jogo de plataformas com saltos"></canvas>
  </main>

  <footer>
  </footer>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var statusEl = document.getElementById('status');
      var W = canvas.width, H = canvas.height;

      // Rectangles are [x, y, width, height]
      var levels = [
        // 1. Degraus
        {
          start: [20, 300],
          plats: [[0, 320, 140, 40], [200, 280, 80, 16], [330, 240, 80, 16], [460, 200, 80, 16], [570, 150, 70, 16]],
          hazards: [],
          goal: [600, 110, 16, 40]
        },
        // 2. Ziguezague
        {
          start: [20, 300],
          plats: [[0, 320, 100, 40], [150, 270, 50, 14], [250, 220, 50, 14], [150, 170, 50, 14], [250, 120, 50, 14], [370, 120, 60, 14], [480, 170, 50, 14], [570, 220, 70, 14]],
          hazards: [],
          goal: [600, 180, 16, 40]
        },
        // 3. Primeiros espinhos
        {
          start: [20, 300],
          plats: [[0, 320, 120, 40], [170, 290, 110, 14], [330, 250, 110, 14], [490, 210, 150, 14]],
          hazards: [[215, 276, 16, 14], [375, 236, 16, 14]],
          goal: [600, 170, 16, 40]
        },
        // 4. Saltos longos
        {
          start: [20, 300],
          plats: [[0, 320, 80, 40], [165, 310, 60, 16], [310, 300, 60, 16], [455, 290, 60, 16], [590, 270, 50, 16]],
          hazards: [],
          goal: [600, 230, 16, 40]
        },
        // 5. Pedras
        {
          start: [20, 300],
          plats: [[0, 320, 70, 40], [138, 290, 36, 14], [242, 260, 36, 14], [346, 290, 36, 14], [450, 250, 36, 14], [554, 220, 86, 14]],
          hazards: [],
          goal: [600, 180, 16, 40]
        },
        // 6. Ilhas
        {
          start: [20, 300],
          plats: [[0, 320, 50, 40], [124, 290, 44, 14], [242, 255, 44, 14], [360, 290, 44, 14], [478, 250, 44, 14], [596, 210, 44, 14]],
          hazards: [[138, 276, 16, 14], [256, 241, 16, 14], [374, 276, 16, 14], [492, 236, 16, 14]],
          goal: [612, 170, 16, 40]
        },
        // 7. Ilhas perigosas
        {
          start: [20, 300],
          plats: [[0, 320, 150, 40], [230, 300, 44, 14], [350, 260, 44, 14], [470, 220, 44, 14], [570, 180, 70, 14]],
          hazards: [[90, 306, 32, 14], [242, 286, 16, 14], [362, 246, 16, 14], [482, 206, 16, 14]],
          goal: [604, 140, 16, 40]
        },
        // 8. Escadaria
        {
          start: [20, 310],
          plats: [[0, 330, 80, 30], [110, 275, 50, 14], [195, 220, 50, 14], [280, 165, 50, 14], [365, 110, 50, 14], [455, 165, 50, 14], [540, 220, 100, 14]],
          hazards: [],
          goal: [600, 180, 16, 40]
        },
        // 9. Pilares
        {
          start: [20, 290],
          plats: [[0, 310, 60, 50], [125, 255, 26, 105], [211, 300, 26, 60], [297, 245, 26, 115], [383, 295, 26, 65], [469, 240, 26, 120], [555, 190, 85, 170]],
          hazards: [],
          goal: [600, 150, 16, 40]
        },
        // 10. Torre em ziguezague
        {
          start: [20, 310],
          plats: [[0, 330, 100, 30], [170, 275, 70, 14], [70, 220, 70, 14], [170, 165, 70, 14], [70, 110, 70, 14], [170, 55, 70, 14], [340, 70, 60, 14], [500, 120, 140, 14]],
          hazards: [],
          goal: [600, 80, 16, 40]
        },
        // 11. Corredor baixo
        {
          start: [20, 300],
          plats: [[0, 320, 90, 40], [144, 320, 80, 40], [280, 320, 80, 40], [418, 320, 80, 40], [558, 320, 82, 40], [0, 232, 520, 36]],
          hazards: [],
          goal: [610, 280, 16, 40]
        },
        // 12. Chão de espinhos
        {
          start: [20, 300],
          plats: [[0, 320, 640, 40]],
          hazards: [[120, 306, 48, 14], [230, 306, 56, 14], [350, 306, 64, 14], [480, 306, 72, 14]],
          goal: [610, 280, 16, 40]
        },
        // 13. Descida
        {
          start: [20, 40],
          plats: [[0, 60, 80, 14], [195, 110, 50, 14], [365, 160, 50, 14], [535, 210, 105, 14]],
          hazards: [[614, 196, 16, 14]],
          goal: [580, 170, 16, 40]
        },
        // 14. Túnel de espinhos
        {
          start: [20, 300],
          plats: [[0, 320, 640, 40], [0, 236, 560, 14]],
          hazards: [[130, 306, 32, 14], [240, 306, 36, 14], [340, 306, 40, 14], [450, 306, 44, 14]],
          goal: [610, 280, 16, 40]
        },
        // 15. Salto de fé
        {
          start: [20, 70],
          plats: [[0, 90, 80, 14], [200, 160, 50, 14], [380, 230, 50, 14], [560, 300, 80, 14]],
          hazards: [[620, 286, 16, 14]],
          goal: [596, 260, 16, 40]
        },
        // 16. Precisão
        {
          start: [20, 300],
          plats: [[0, 320, 60, 40], [170, 315, 24, 14], [304, 310, 24, 14], [438, 305, 24, 14], [572, 300, 68, 14]],
          hazards: [],
          goal: [605, 260, 16, 40]
        },
        // 17. Pilares altos
        {
          start: [20, 290],
          plats: [[0, 310, 60, 50], [144, 250, 24, 110], [252, 300, 24, 60], [360, 240, 24, 120], [468, 290, 24, 70], [576, 230, 64, 130]],
          hazards: [],
          goal: [600, 190, 16, 40]
        },
        // 18. Corredor de espinhos
        {
          start: [20, 300],
          plats: [[0, 320, 640, 40]],
          hazards: [[60, 306, 48, 14], [148, 306, 64, 14], [252, 306, 80, 14], [372, 306, 80, 14], [492, 306, 64, 14]],
          goal: [610, 280, 16, 40]
        },
        // 19. Escalada alta
        {
          start: [20, 310],
          plats: [[0, 330, 70, 30], [100, 260, 44, 14], [190, 190, 44, 14], [280, 120, 44, 14], [370, 50, 44, 14], [510, 120, 50, 14], [600, 190, 40, 14]],
          hazards: [],
          goal: [608, 150, 16, 40]
        },
        // 20. Desafio final
        {
          start: [20, 300],
          plats: [[0, 320, 200, 40], [304, 300, 30, 14], [438, 265, 30, 14], [572, 230, 68, 14]],
          hazards: [[46, 306, 48, 14], [124, 306, 64, 14]],
          goal: [612, 190, 16, 40]
        }
      ];

      var keys = { left: false, right: false, jump: false };
      var lvl = 0, falls = 0, won = false, p;

      function load(i) {
        lvl = i;
        var s = levels[i].start;
        p = { x: s[0], y: s[1], w: 20, h: 20, vx: 0, vy: 0, ground: false };
        updateStatus();
      }

      function updateStatus() {
        statusEl.textContent = won
          ? 'Terminou todos os níveis com ' + falls + ' quedas. Prima Espaço para jogar de novo.'
          : 'Nível ' + (lvl + 1) + ' de ' + levels.length + '. Quedas: ' + falls;
      }

      function overlap(a, r) {
        return a.x < r[0] + r[2] && a.x + a.w > r[0] && a.y < r[1] + r[3] && a.y + a.h > r[1];
      }

      function step() {
        var L = levels[lvl];
        p.vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 3.2;
        p.x += p.vx;
        L.plats.forEach(function (r) {
          if (overlap(p, r)) {
            if (p.vx > 0) p.x = r[0] - p.w;
            else if (p.vx < 0) p.x = r[0] + r[2];
          }
        });
        p.x = Math.max(0, Math.min(W - p.w, p.x));

        if (keys.jump && p.ground) p.vy = -9.5;
        p.vy = Math.min(p.vy + 0.5, 12);
        p.y += p.vy;
        p.ground = false;
        L.plats.forEach(function (r) {
          if (overlap(p, r)) {
            if (p.vy > 0) { p.y = r[1] - p.h; p.ground = true; }
            else if (p.vy < 0) { p.y = r[1] + r[3]; }
            p.vy = 0;
          }
        });

        var hit = p.y > H + 40 || L.hazards.some(function (h) {
          return overlap({ x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 6 }, [h[0] + 3, h[1] + 3, h[2] - 6, h[3] - 3]);
        });
        if (hit) { falls++; load(lvl); return; }

        if (overlap(p, L.goal)) {
          if (lvl < levels.length - 1) load(lvl + 1);
          else { won = true; updateStatus(); }
        }
      }

      function draw() {
        var L = levels[lvl];
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        L.plats.forEach(function (r) { ctx.fillRect(r[0], r[1], r[2], r[3]); });

        ctx.fillStyle = '#ff5a5a';
        L.hazards.forEach(function (h) {
          var n = Math.max(1, Math.round(h[2] / 16)), w = h[2] / n;
          for (var i = 0; i < n; i++) {
            ctx.beginPath();
            ctx.moveTo(h[0] + i * w, h[1] + h[3]);
            ctx.lineTo(h[0] + i * w + w / 2, h[1]);
            ctx.lineTo(h[0] + (i + 1) * w, h[1] + h[3]);
            ctx.closePath();
            ctx.fill();
          }
        });

        var g = L.goal;
        ctx.fillStyle = '#fff';
        ctx.fillRect(g[0], g[1], 3, g[3]);
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath();
        ctx.moveTo(g[0] + 3, g[1]);
        ctx.lineTo(g[0] + g[2] + 6, g[1] + 8);
        ctx.lineTo(g[0] + 3, g[1] + 16);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffd54a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#003893';
        ctx.fillRect(p.x + 5, p.y + 5, 3, 4);
        ctx.fillRect(p.x + 12, p.y + 5, 3, 4);

        if (won) {
          ctx.fillStyle = 'rgba(0, 42, 112, 0.85)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 32px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Venceu!', W / 2, H / 2);
        }
      }

      var last = 0, acc = 0, STEP = 1000 / 60;
      function frame(t) {
        if (!last) last = t;
        acc += Math.min(t - last, 100);
        last = t;
        while (acc >= STEP) { if (!won) step(); acc -= STEP; }
        draw();
        requestAnimationFrame(frame);
      }

      function press(k, down) {
        keys[k] = down;
        if (down && k === 'jump' && won) { won = false; falls = 0; load(0); }
      }

      var map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
      window.addEventListener('keydown', function (e) {
        var k = map[e.code];
        if (k) { e.preventDefault(); press(k, true); }
        else if (e.code === 'KeyR' && !won) load(lvl);
      });
      window.addEventListener('keyup', function (e) {
        var k = map[e.code];
        if (k) press(k, false);
      });

      load(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
